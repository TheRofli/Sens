[workspace]
members = [
  "crates/sens-protocol",
  "crates/sens-core",
  "crates/sens-broker",
  "crates/sens-mcp",
  "crates/sens-connect",
  "apps/desktop-ui/src-tauri",
]
resolver = "2"

[workspace.package]
version = "1.1.6"
edition = "2024"
license = "MIT"
rust-version = "1.85"
authors = ["Sens contributors"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
directories = "6.0"
rmcp = { version = "0.16.0", features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.47", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
