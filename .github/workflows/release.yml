name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $appVersion = (Get-Content -Raw apps/desktop-ui/src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ($tag -ne $appVersion) { throw "Tag $tag does not match app version $appVersion" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop-ui/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            sidecars/sight/requirements-runtime.txt
            sidecars/speech/requirements-runtime.txt

      - uses: dtolnay/rust-toolchain@stable

      # sccache caches compiled dependencies by source content, so version
      # bumps (which change Cargo.lock and invalidate target-dir caches) do
      # not force a full rebuild of the ~400 dependency crates.
      - name: Setup sccache
        uses: mozilla/sccache-action@v0.0.6

      - name: Install npm dependencies
        working-directory: apps/desktop-ui
        run: npm ci

      - name: Build installers
        working-directory: apps/desktop-ui
        run: npm run native:build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/Sens_*_x64-setup.exe
            target/release/bundle/nsis/Sens_*_x64-setup.exe.sig
            target/release/bundle/latest.json
